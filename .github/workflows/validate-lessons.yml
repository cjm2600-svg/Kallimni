name: Validate Kallimni lesson catalog
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lessons/**'
      - 'agent/**'
      - '.github/workflows/validate-lessons.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate lesson catalog if present
        shell: bash
        run: |
          if [ -f agent/test_catalog.py ]; then
            python -m unittest discover -s agent -p 'test_*.py'
          else
            echo 'No lesson catalog agent uploaded yet; validation not runnable.'
            exit 1
          fi
