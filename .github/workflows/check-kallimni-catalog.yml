name: Check Kallimni lesson catalog
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lessons/**'
      - 'agent/**'
      - '.github/workflows/check-kallimni-catalog.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate catalog schema and IDs
        run: python agent/test_catalog.py
